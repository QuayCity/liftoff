[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "tools/licensegen", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
liftoff-core = { path = "crates/core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
