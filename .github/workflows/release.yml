# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) builds and publishes a release:
#   liftoff-linux-x64, liftoff-win-x64.exe, liftoff-macos-arm64     the single-file CLI
#   liftoff-vscode-<platform>.vsix                                  the VS Code extension, CLI included
#   LiftOff-Setup-<version>.exe, LiftOff-<version>-x86_64.AppImage  the desktop app (Windows, Linux)
#   LiftOff-<version>-win-x64.zip                                   the desktop app unpacked: what an installed app updates from
# No desktop app for macOS: unsigned, Gatekeeper blocks it, and signing needs a paid Apple account.
# The tag has to match the version in the code (see the first job), so a release says what it is,
# and CHANGELOG.md needs a "## <version>" section: that section is the release's notes.
# Run it by hand (Actions > Release > Run workflow) for a dry run: everything is built, nothing published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: The tag matches the version in the code, with release notes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli=$(sed -n "s/^const VERSION = '\(.*\)'$/\1/p" packages/liftoff/src/cli/main.ts)
          core=$(node -p "require('./packages/liftoff/package.json').version")
          ext=$(node -p "require('./apps/vscode/package.json').version")
          app=$(node -p "require('./apps/desktop/package.json').version")
          echo "tag $tag, CLI $cli, packages/liftoff $core, apps/vscode $ext, apps/desktop $app"
          [ "$tag" = "$cli" ] && [ "$tag" = "$core" ] && [ "$tag" = "$ext" ] && [ "$tag" = "$app" ] || { echo "::error::set the version to $tag in main.ts and the three package.json files"; exit 1; }
          awk -v v="$tag" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | grep -q '[^[:space:]]' || { echo "::error::write the release notes: a '## $tag' section in CHANGELOG.md"; exit 1; }

  build:
    name: Build for ${{ matrix.name }}
    needs: version
    # runs after the check, or without it on a dry run
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, vsce: linux-x64, exe: liftoff, ext: '' }
          - { os: windows-latest, name: win-x64, vsce: win32-x64, exe: liftoff.exe, ext: .exe }
          - { os: macos-latest, name: macos-arm64, vsce: darwin-arm64, exe: liftoff, ext: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/liftoff/package-lock.json
            apps/vscode/package-lock.json
            apps/desktop/package-lock.json
      - name: Build the CLI
        working-directory: packages/liftoff
        run: npm ci && npm test && npm run build:cli
      - name: It runs
        working-directory: packages/liftoff
        run: ./build/${{ matrix.exe }} --version
      - name: The VS Code extension for this platform
        working-directory: apps/vscode
        run: npm ci && npm run build && npm run bundle-cli && npx vsce package --target ${{ matrix.vsce }} --out ../../liftoff-vscode-${{ matrix.vsce }}.vsix
      - name: The desktop app's installer for this platform (the CLI goes inside it)
        if: matrix.name != 'macos-arm64'
        working-directory: apps/desktop
        # Not code-signed yet: with no certificate configured, Windows SmartScreen warns the first
        # time it starts.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm ci && npm run build && npm run build:electron && npx electron-builder --publish never
      - name: Name the CLI for the release
        run: cp packages/liftoff/build/${{ matrix.exe }} liftoff-${{ matrix.name }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            liftoff-${{ matrix.name }}${{ matrix.ext }}
            liftoff-vscode-${{ matrix.vsce }}.vsix
            apps/desktop/release/LiftOff-Setup-*.exe
            apps/desktop/release/LiftOff-*-win-x64.zip
            apps/desktop/release/LiftOff-*.AppImage
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The release notes, from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Every file, wherever it sits: the installers keep their apps/desktop/release/ folders.
        # The notes come first; GitHub adds the link to the full list of commits after them.
        run: find dist -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "LiftOff $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
