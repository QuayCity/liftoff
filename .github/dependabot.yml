# Dependabot opens pull requests when a dependency has a new version: every Monday, one pull
# request per folder for the minor and patch updates together, and one per major update so
# those get a look of their own. Security fixes come as soon as an advisory is published (turn
# on Dependabot alerts and security updates under Settings > Code security).
# The Tests workflow runs on every pull request, so an update that breaks something shows there.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /packages/liftoff
      - /apps/desktop
      - /apps/vscode
      - /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @types/node describes the Node the code runs on, not the newest Node: 24 for the CLI and
      # the desktop app (Electron 44), 20 for the extension (VS Code 1.90, its oldest supported
      # version). Raise these by hand when the runtime moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
